<nc-tool-bar
  class="dicom-viewer-tool"
  [toolGroupId]="toolGroupId"
  [toolList]="toolList"
  [activeViewportId]="activeViewportId"
  (toolbarInit)="onToolbarInit()"
  (toolbarDestroy)="onToolbarDestroy()"
>
</nc-tool-bar>

<div
  class="dicom-viewer-container"
  [ngClass]="{
    'layout-11': layout === Layout.LAYOUT_1x1,
    'layout-12': layout === Layout.LAYOUT_1x2,
    'layout-13': layout === Layout.LAYOUT_1x3,
    'layout-22': layout === Layout.LAYOUT_2x2,
  }"
>
  <nc-viewport
    class="dicom-viewer-viewport"
    *ngFor="let viewportInput of viewportInputs"
    [viewportInput]="viewportInput"
    [active]="activeViewportId === viewportInput.viewportId"
    (viewportInit)="onViewportInit($event)"
    (viewportDestroy)="onViewportDestroy($event)"
    (click)="onViewportClick(viewportInput.viewportId)"
  >
  </nc-viewport>
</div>
